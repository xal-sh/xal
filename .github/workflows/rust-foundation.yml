name: Rust foundation

on:
  push:
    branches: [rust]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            deployment_target: "10.13"
          - target: aarch64-apple-darwin
            runner: macos-15
            deployment_target: "11.0"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: foundation-${{ matrix.target }}
          cache-on-failure: true

      - name: Install musl linker
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'RUSTFLAGS=-C linker=musl-gcc' >> "$GITHUB_ENV"

      - name: Configure installed Windows POSIX shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $root = Split-Path (Split-Path $git)
          $shell = Join-Path $root 'bin/bash.exe'
          if (!(Test-Path $shell)) { throw 'A supported POSIX shell is required; install Git for Windows.' }
          "SHELL=$shell" >> $env:GITHUB_ENV
          (Join-Path $root 'bin') >> $env:GITHUB_PATH
          (Join-Path $root 'usr/bin') >> $env:GITHUB_PATH

      - run: cargo fmt --all -- --check
      - run: cargo test -p xal-host -p xal-services -p xal-rust -p xal-plugin-inspect -p xal-plugin-diagnostics -p xal-plugin-workspace -p xal-providers -p xal-plugin-providers -p xal-plugin-classify -p xal-plugin-context -p xal-plugin-lsp -p xal-plugin-mcp --target ${{ matrix.target }} --locked --no-fail-fast
      - run: cargo clippy -p xal-host -p xal-services -p xal-rust -p xal-plugin-inspect -p xal-plugin-diagnostics -p xal-plugin-workspace -p xal-providers -p xal-plugin-providers -p xal-plugin-classify -p xal-plugin-context -p xal-plugin-lsp -p xal-plugin-mcp --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - run: cargo build -p xal-rust --release --target ${{ matrix.target }} --locked

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check plugin and headless dependency boundaries
        run: bun scripts/rust/check-boundaries.ts

      - name: Build legacy ownership adapter for the compatibility probe
        env:
          RUSTFLAGS: ""
        run: bun run native:ensure

      - name: Smoke test and record executable bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/xal-rust"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
          bun scripts/rust/check-headless.ts "$binary"
          if [[ "$RUNNER_OS" != Windows ]]; then python3 scripts/rust/check-terminal.py "$binary"; fi
          wc -c < "$binary"
