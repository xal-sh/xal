[package]
name = "xal-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[lib]
crate-type = ["cdylib"]

[dependencies]
xal-services = { path = "../xal-services" }
napi = { version = "=3.12.1", default-features = false, features = ["dyn-symbols", "napi4"] }
napi-derive = "=3.6.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "=2.4.1"
