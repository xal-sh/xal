[package]
name = "xal-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[lib]
crate-type = ["cdylib"]

[dependencies]
globset = "=0.4.20"
grep-matcher = "=0.1.8"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.16"
ignore = "=0.4.25"
napi = { version = "=3.12.1", default-features = false, features = ["dyn-symbols", "napi4"] }
napi-derive = "=3.6.3"
encoding_rs = "=0.8.35"
html2md = "=0.2.15"
jsonschema = { version = "=0.37.4", default-features = false }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[build-dependencies]
napi-build = "=2.4.1"
