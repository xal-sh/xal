[package]
name = "xal-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[dependencies]
xal-host = { path = "../xal-host" }
xal-services = { path = "../xal-services" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "time", "sync", "macros"] }
