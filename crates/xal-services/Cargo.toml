[package]
name = "xal-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[dependencies]
bytes = "=1.12.1"
futures-util = "=0.3.34"
reqwest13 = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
globset = "=0.4.20"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.16"
ignore = "=0.4.25"
jsonschema = { version = "=0.37.4", default-features = false }
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes"] }
